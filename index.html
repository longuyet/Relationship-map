/* ---------- Hình học mũi tên ---------- */
function shape(st,L2){
 let loc=[[0,0],[L2,0]];
 if(st=='zigzag'){const n=Math.max(2,Math.round(L2/18));loc=[];for(let i=0;i<=n;i++)loc.push([i*L2/n,i==0||i==n?0:(i%2?11:-11)])}
 else if(st=='tangle'){const k=Math.max(2,Math.round(L2/46)),Th=k*2*Math.PI,N=k*24;loc=[];for(let i=0;i<=N;i++){const t=Th*i/N;loc.push([L2*i/N-13*Math.sin(t),13*(1-Math.cos(t))])}}
 else if(st=='heart'){const s=Math.min(1,L2*.3/32),c=L2*.28;loc=[[0,0],[c,0]];for(let t=Math.PI;t<=3*Math.PI+.01;t+=.15)loc.push([c+16*Math.pow(Math.sin(t),3)*s,(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)+17)*s]);loc.push([L2,0])}
 return loc}
function along(P,f){let t=0;const d=[];for(let i=1;i<P.length;i++){t+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);d.push(t)}

/* ---------- Link / QR ---------- */
const b64=u=>{let s='';u.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function pipe(bytes,T){return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new T('deflate-raw'))).arrayBuffer())}
async function enc(){
 const m={c:S.chars.map(c=>[c.id,c.name,c.img&&c.img.startsWith('data:')?'':c.img||'',c.desc,Math.round(c.x),Math.round(c.y),sz(c)]),e:S.edges.map(e=>[e.from,e.to,e.style,e.color,e.label||'',e.pts?e.pts.map(p=>[+p[0].toFixed(3),+p[1].toFixed(3)]):0,e.pt==null?0:+(+e.pt).toFixed(3)])};
 let by=new TextEncoder().encode(JSON.stringify(m)),pre='p';
 if(window.CompressionStream){by=await pipe(by,CompressionStream);pre='z'}
 return pre+b64(by);
}
async function dec(s){
 let by=unb64(s.slice(1));if(s[0]=='z')by=await pipe(by,DecompressionStream);
 const m=JSON.parse(new TextDecoder().decode(by));
 return{chars:m.c.map(([id,name,img,desc,x,y,z])=>({id:String(id),name:String(name),img:safeUrl(img),desc:String(desc),x:+x||R,y:+y||R,s:Math.max(30,Math.min(140,+z||DS))})),
  edges:m.e.map(([f,t,st,col,lb,pts,pt])=>({id:uid(),from:String(f),to:String(t),style:STY.some(s=>s[0]==st)?st:'straight',color:okc(col),label:String(lb),pt:pt>0?+pt:null,pts:Array.isArray(pts)?pts.map(p=>[+p[0]||0,+p[1]||0]):null}))};
}
async function qrBox(){
 const box=h('div',{class:'row',style:'flex-direction:column;align-items:stretch'},h('small',{},T('Đang tạo…')));
 const lost=S.chars.some(c=>c.img&&c.img.startsWith('data:'));
 const url=location.href.split('#')[0]+'#d='+await enc();
 const li=h('input',{type:'text',readOnly:true,value:url});li.onfocus=()=>li.select();
 box.replaceChildren(h('small',{},T('Link riêng của sơ đồ (dữ liệu nằm ngay trong link):')),li);
 try{const q=qrcode(0,'L');q.addData(url);q.make();const n=q.getModuleCount(),k=6,qw=(n+8)*k,cw=Math.max(qw,300),cv=h('canvas',{width:cw,height:qw+44,style:'align-self:center;max-width:100%;border:1px solid #eee'}),x=cv.getContext('2d'),ox=(cw-qw)/2;
  x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.fillStyle='#000';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect(ox+(c+4)*k,(r+4)*k,k,k);
  const wi=new Image();wi.onload=()=>x.drawImage(wi,0,qw);wi.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${cw}" height="44">${wmFrag(cw/2,0)}</svg>`);
  box.append(cv,h('button',{onclick:()=>cv.toBlob(b=>dl(b,'qr-so-do.png'))},ic('download'),T(' Tải mã QR')));
 }catch(e){box.append(h('small',{style:'color:#b91c1c'},T('Sơ đồ quá lớn để nhét vào mã QR. Hãy rút gọn nội dung (mô tả ngắn hơn, ít nhân vật hơn) hoặc dùng ảnh/HTML.')))}
 box.append(h('button',{class:'g',onclick:()=>navigator.clipboard&&navigator.clipboard.writeText(url)},ic('copy'),T(' Chép link')));
 if(lost)box.append(h('small',{},T('Lưu ý: ảnh tải lên từ máy không đưa vào QR/link được (quá nặng); nhân vật đó sẽ hiện chữ cái đầu. Dùng link ảnh (URL) để giữ ảnh.')));
 return box;
}

/* ---------- Cộng tác realtime ---------- */
const FIREBASE_URL='https://relation-map-f40cb-default-rtdb.firebaseio.com';
const FB=FIREBASE_URL.replace(/\/+$/,''),ME=uid()+uid(),fbUrl=p=>FB+'/rooms/'+fbRoom+p+'.json';
let mode='',peer=null,conns=[],hostConn=null,isHost=false,synced=false,noSave=false,last={c:{},e:{}},dragId=null,cnt=1,roomLink='',lt=0,es=null,fbRoom='';
const pushT=()=>{const n=Date.now();if(n-lt>70){lt=n;push()}};
const snap=()=>{const c={},e={};S.chars.forEach(x=>c[x.id]=JSON.stringify(x));S.edges.forEach(x=>e[x.id]=JSON.stringify(x));return{c,e}};
const cleanC=v=>v&&v.id?{id:String(v.id).slice(0,24),name:String(v.name||'?').slice(0,60),img:safeUrl(v.img).slice(0,80000),desc:String(v.desc||'').slice(0,3000),x:+v.x||R,y:+v.y||R,s:Math.max(30,Math.min(140,+v.s||DS))}:null;
const cleanE=v=>v&&v.id?{id:String(v.id).slice(0,24),from:String(v.from),to:String(v.to),style:STY.some(q=>q[0]==v.style)?v.style:'straight',color:okc(v.color),label:String(v.label||'').slice(0,60),pts:Array.isArray(v.pts)?v.pts.slice(0,80).map(p=>[+p[0]||0,+p[1]||0]):null,pt:v.pt>0?+v.pt:null}:null;

function push(){
 if(!mode||!synced)return;const ops=[],nc={},ne={};
 S.chars.forEach(c=>{const j=JSON.stringify(c);nc[c.id]=j;if(last.c[c.id]!==j)ops.push({t:'c',v:c})});
 Object.keys(last.c).forEach(id=>{if(!(id in nc))ops.push({t:'dc',id})});
 S.edges.forEach(c=>{const j=JSON.stringify(c);ne[c.id]=j;if(last.e[c.id]!==j)ops.push({t:'e',v:c})});
 Object.keys(last.e).forEach(id=>{if(!(id in ne))ops.push({t:'de',id})});
 last={c:nc,e:ne};
 if(ops.length){if(mode=='fb')fbSend(ops);else bcast({t:'ops',ops})}
}
function applyOps(ops){
 let rn=false;
 ops.forEach(o=>{
  if(o.t=='c'){const v=cleanC(o.v);if(!v||v.id==dragId)return;const i=S.chars.findIndex(c=>c.id==v.id);
   if(i<0){S.chars.push(v);rn=true}else{const q=S.chars[i];if(q.name!=v.name||q.img!=v.img||q.desc!=v.desc||sz(q)!=sz(v))rn=true;else{const el=[...board.querySelectorAll('.node')].find(n=>n.dataset.id==v.id);if(el){el.style.left=v.x-rad(v)+'px';el.style.top=v.y-rad(v)+'px'}}S.chars[i]=v}
   last.c[v.id]=JSON.stringify(v)}
  else if(o.t=='dc'){S.chars=S.chars.filter(c=>c.id!=o.id);delete last.c[o.id];rn=true}
  else if(o.t=='e'){const v=cleanE(o.v);if(!v)return;const i=S.edges.findIndex(x=>x.id==v.id);if(i<0)S.edges.push(v);else S.edges[i]=v;last.e[v.id]=JSON.stringify(v)}
  else if(o.t=='de'){S.edges=S.edges.filter(x=>x.id!=o.id);delete last.e[o.id]}

/* --- Firebase Realtime Database--- */
function fbSend(ops){
 const b={};ops.forEach(o=>{b[(o.t.slice(-1)=='c'?'chars/':'edges/')+(o.v?o.v.id:o.id)]=o.v?Object.assign(JSON.parse(JSON.stringify(o.v)),{_by:ME}):null});
 fetch(fbUrl(''),{method:'PATCH',body:JSON.stringify(b)}).catch(()=>{});
}
function fbListen(){
 if(es)es.close();es=new EventSource(fbUrl(''));
 ['put','patch'].forEach(ev=>es.addEventListener(ev,m=>{let d;try{d=JSON.parse(m.data)}catch(e){return}fbEv(d.path||'/',d.data,ev=='patch')}));
}
function fbEv(path,data,patch){
 const seg=path.split('/').filter(Boolean);
 if(!seg.length){
  if(patch){Object.keys(data||{}).forEach(k=>fbEv('/'+k,data[k],false));return}
  const o=data||{};S={chars:Object.values(o.chars||{}).map(cleanC).filter(Boolean),edges:Object.values(o.edges||{}).map(cleanE).filter(Boolean)};
  last=snap();synced=true;hint('');renderNodes();renderEdges();stat();return}
 const col=seg[0]=='chars'?'c':seg[0]=='edges'?'e':null;if(!col)return;
 if(seg.length==1){
  if(patch){Object.keys(data||{}).forEach(k=>fbEv('/'+seg[0]+'/'+k,data[k],false));return}
  const nw=data||{};(col=='c'?S.chars:S.edges).map(x=>x.id).filter(id=>!(id in nw)).forEach(id=>applyOps([{t:'d'+col,id}]));
  Object.keys(nw).forEach(k=>fbEv('/'+seg[0]+'/'+k,nw[k],false));return}

}
async function fbCreate(){

/* --- P2P (PeerJS)--- */
function onMsg(m,from){

function stat(){const on=mode&&synced;$('#cst').textContent=on?(mode=='fb'?'● Realtime':'● '+cnt+L(' người',' online')):'';$('#bCol').className=on?'':'g'}

const noLib=()=>typeof Peer=='undefined'&&(alert(L('Không tải được thư viện kết nối (PeerJS). Hãy kiểm tra mạng.','Could not load the connection library (PeerJS). Check your network.')),true);

 modal(h('h3',{},L('Đang cộng tác','Collaborating')),h('small',{},L('Gửi link này cho người cùng vẽ:','Send this link to the people drawing with you:')),li,h('small',{},mode=='fb'?L('Phòng được lưu trực tuyến, bạn có thể đóng tab.','The room is stored online; you can close this tab.'):cnt+L(' người trong phòng',' people in the room')),
